plugins { id 'com.android.application' }
android {
    namespace 'com.abd2lahmantahir.my24hours'
    compileSdk 34
    defaultConfig {
        applicationId 'com.abd2lahmantahir.my24hours'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
