name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy web app into assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html icon-192.png icon-512.png android/app/src/main/assets/www/
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk My24Hours.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: My 24 Hours v1.${{ github.run_number }}
          make_latest: true
          files: My24Hours.apk
